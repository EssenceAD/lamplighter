<!doctype html>
<html lang="ko">
<head>

<meta name="theme-color" content="#05060f">

<style>
  /* Everything on screen is cut paper pinned over the stage: same paper scan, same ink, same amber. */
  :root { --ink: #17131f; --paper: #efe1c6; --paper-d: #d9c7a4; --edge: #8f7c58; --amber: #f2a03c; --navy: #1b2248;
    --font: "Fraunces", "Hahmlet", "Apple SD Gothic Neo", serif; --torn: url(./assets/paper/torn.png); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; overscroll-behavior: none; touch-action: none;
    font: 500 16px/1.4 var(--font); color: var(--ink); user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; overflow: hidden; width: min(100vw, 56.25vh); height: 100vh; }
  canvas { display: block; position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hide { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  svg.ic { width: 1.35em; height: 1.35em; fill: currentColor; flex: none; vertical-align: -0.3em; }
  b, .num { font-weight: 800; }
  /* a sheet of cut paper: real paper scan under a tint, ragged edge, soft shadow from the stage light */
  .paper { background: var(--paper) url(./assets/paper/Paper001_Color.jpg) center / 340px; background-blend-mode: multiply; color: var(--ink); }
  /* the edge of every paper piece is a real torn edge: a mask cut from a CC0 scan (tools/torn.js), nine-sliced so the tear keeps its scale */
  .paper, .torn { -webkit-mask-box-image-source: var(--torn); -webkit-mask-box-image-slice: 40 fill; -webkit-mask-box-image-width: 14px; -webkit-mask-box-image-repeat: round;
    mask-border-source: var(--torn); mask-border-slice: 40 fill; mask-border-width: 14px; mask-border-repeat: round; }
  h1 > .paper, .sheet, .pick, .btn.big { -webkit-mask-box-image-width: 20px; mask-border-width: 20px; }
  @supports not ((-webkit-mask-box-image-source: none) or (mask-border-source: none)) { .paper, .torn { -webkit-mask: var(--torn) center / 100% 100% no-repeat; mask: var(--torn) center / 100% 100% no-repeat; } }
  .lift { filter: drop-shadow(0 3px 0 rgba(60, 40, 20, .55)) drop-shadow(0 8px 10px rgba(0, 0, 0, .45)); }
  .pin { position: relative; }
  .pin::before { content: ""; position: absolute; left: 50%; top: -5px; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffd08a, #b5601c 60%, #5a2a0c); box-shadow: 0 2px 2px rgba(0, 0, 0, .5); z-index: 2; }
  .btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 22px; font-weight: 800; font-size: 18px; }
  .btn > span, .tab > span { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%; }
  .btn.paper { background-color: #f6b455; } .btn.plain.paper { background-color: var(--paper); }
  .btn:active { transform: translateY(2px) rotate(-.4deg); } .btn[disabled] { opacity: .45; pointer-events: none; }
  .tab { width: 50px; height: 50px; display: grid; place-items: center; font-size: 20px; flex: none; }
  .tab.on.paper { background-color: #f6b455; }
  /* screens */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom)); }
  .veil { background: linear-gradient(rgba(5, 6, 15, .35), rgba(5, 6, 15, .7) 45%); }
  #title { justify-content: flex-end; align-items: center; gap: 12px; padding-bottom: 9vh; }
  #title h1 { position: absolute; top: 12vh; margin: 0; font: 800 50px/1.1 "Hahmlet", serif; letter-spacing: .1em; padding: 16px 30px 18px; transform: rotate(-2deg); }
  #title .sub { position: absolute; top: calc(12vh + 108px); font-size: 17px; padding: 7px 18px; transform: rotate(1.2deg); }
  #title .btn.big { width: 230px; min-height: 60px; font-size: 21px; }
  .row3 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; } .row3 .btn { padding: 10px 16px; font-size: 16px; min-height: 48px; }
  .best { font-size: 15px; padding: 6px 16px; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 52px; } .top h2 { flex: 1; text-align: center; font: 800 23px "Hahmlet", serif; margin: 0; padding: 9px 12px; }
  .body { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 10px 4px 8px; }
  .strip { display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin-bottom: 11px; } .strip .t { flex: 1; min-width: 0; } .strip .t b { display: block; font-size: 17px; } .strip .t span { font-size: 15px; color: #54452f; }
  .strip .btn { min-height: 46px; padding: 8px 14px; font-size: 16px; } .strip.done { opacity: .8; }
  .dots { display: flex; gap: 5px; margin-top: 5px; } .dots i { width: 12px; height: 12px; background: #b9a888; -webkit-mask: var(--torn) center / 100% 100% no-repeat; mask: var(--torn) center / 100% 100% no-repeat; } .dots i.on { background: #d9801c; }
  h3 { font: 700 16px "Hahmlet", serif; color: var(--paper); margin: 12px 6px 8px; text-shadow: 0 1px 4px #000; }
  .rank { display: flex; gap: 10px; padding: 9px 12px; font-size: 16px; border-bottom: 1.5px dashed rgba(60, 40, 20, .3); } .rank b { width: 28px; color: #a8560f; } .rank span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rank.me { background: rgba(242, 160, 60, .28); }
  .ranks { padding: 6px 4px 10px; }
  /* in a night: three pinned notes, one line each */
  #hud .notes { position: absolute; left: 8px; top: max(11px, env(safe-area-inset-top)); display: flex; gap: 6px; align-items: center; }
  .note { display: flex; align-items: center; gap: 6px; padding: 6px 12px 7px 9px; font-size: 16px; white-space: nowrap; min-height: 40px; }
  .note .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .note .num { font-size: 21px; line-height: 1; } .note svg.ic { width: 23px; height: 23px; }
  .note:nth-child(1) { transform: rotate(-1.6deg); } .note:nth-child(2) { transform: rotate(1.1deg); margin-left: 5px; } .note:nth-child(3) { transform: rotate(-0.7deg); }
  .note.bump { animation: bump .25s; } @keyframes bump { 40% { transform: scale(1.12) rotate(-2deg); } }
  #hud .tabs { position: absolute; right: 8px; top: max(11px, env(safe-area-inset-top)); display: flex; gap: 6px; } #hud .tabs .tab { width: 44px; height: 42px; }
  /* the frame can be narrower than the window (tall phones, browser bars), so the top row is laid out by the frame's own width */
  #frame { container-type: inline-size; }
  @container (max-width: 445px) { #hud .tabs { top: calc(max(11px, env(safe-area-inset-top)) + 52px); } #hud .notes { right: 8px; flex-wrap: nowrap; } .note { padding: 6px 10px 7px 8px; } }
  #hud .bottom { position: absolute; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; }
  #call .btn { font-size: 16px; padding: 10px 14px; min-height: 50px; }
  #flash { width: 104px; height: 112px; flex: none; position: relative; display: grid; place-items: center; }
  #flash svg { width: 104px; height: 112px; overflow: visible; }
  #flash .lampbody { fill: #1c1626; stroke: #d7c19a; stroke-width: 2.2; stroke-linejoin: round; }
  #flash .flame-bg { fill: #3a2f3f; } #flash .flame { fill: #ffb347; }
  #flash.ready .lampbody { fill: #2a1a12; stroke: #ffd08a; } #flash.ready { animation: sway 1.2s ease-in-out infinite; }
  #flash em { position: absolute; bottom: 9px; left: 0; right: 0; text-align: center; font: 800 16px "Hahmlet", serif; color: var(--paper); font-style: normal; }
  @keyframes sway { 50% { transform: rotate(-3deg) scale(1.04); } }
  #tip { position: absolute; left: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 104px); transform: rotate(-1deg); max-width: calc(100% - 24px); word-break: keep-all; padding: 13px 20px 14px; font-size: 17px; text-align: center; pointer-events: none; transition: opacity .5s; animation: drop .3s ease-out; }
  @keyframes drop { from { transform: translateY(22px) rotate(-4deg); opacity: 0; } }
  /* round build menu: paper tokens */
  #menu { position: absolute; inset: 0; pointer-events: none; }
  .mi { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; pointer-events: auto; animation: popin .16s ease-out both; }
  .mi > span { position: absolute; inset: 0; display: grid; place-items: center; }
  .mi svg.ic { width: 30px; height: 34px; margin-top: -12px; } .mi small { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 800; color: #8a4a10; z-index: 1; }
  .mi i { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-style: normal; font-size: 15px; font-weight: 700; color: var(--paper); white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  .mi.poor > span { background-color: #9a9080; } .mi.poor small { color: #5a2a10; }
  .mt { position: absolute; transform: translateX(-50%); padding: 7px 16px; font-size: 15px; white-space: nowrap; }
  @keyframes popin { from { transform: scale(.4) rotate(-20deg); opacity: 0; } }
  /* sheets: the stage stays visible behind them */
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 15, .3); padding: 16px; }
  .sheet { width: 100%; max-width: 350px; padding: 26px 20px 22px; text-align: center; }
  .sheet h2 { margin: 0 0 8px; font: 800 25px "Hahmlet", serif; } .sheet p { margin: 7px 0; font-size: 16px; color: #4a3b28; }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 8px 0; color: #cdbb96; } .stars svg { width: 44px; height: 44px; } .stars .on { color: #e0891a; }
  .sheet .row { display: flex; gap: 10px; margin-top: 16px; } .sheet .row .btn { flex: 1; padding: 11px 6px; font-size: 17px; }
  .sheet input[type=text] { width: 100%; font: inherit; font-size: 19px; padding: 11px; border: 2px dashed var(--edge); background: rgba(255, 250, 235, .7); text-align: center; margin-top: 8px; user-select: text; -webkit-user-select: text; color: var(--ink); }
  .setrow { display: flex; align-items: center; gap: 10px; margin: 12px 0; text-align: left; font-size: 16px; } .setrow span { width: 70px; font-weight: 700; } .setrow input[type=range] { flex: 1; accent-color: #d9801c; }
  .tog { width: 58px; height: 32px; background: #b9a888; position: relative; flex: none; -webkit-mask-box-image-source: var(--torn); -webkit-mask-box-image-slice: 40 fill; -webkit-mask-box-image-width: 9px; -webkit-mask-box-image-repeat: round; mask-border-source: var(--torn); mask-border-slice: 40 fill; mask-border-width: 9px; mask-border-repeat: round; } .tog::after { content: ""; position: absolute; top: 5px; left: 6px; width: 22px; height: 22px; background: var(--paper); clip-path: polygon(50% 0, 100% 40%, 80% 100%, 15% 95%, 0 35%); transition: .15s; } .tog.on { background: #e08a1c; } .tog.on::after { left: 30px; }
  /* reward cards: ragged paper, a big ink drawing, a title, one line */
  .cardmodal .sheet { max-width: 390px; padding: 20px 10px 18px; background: none; -webkit-mask-box-image-source: none; mask-border-source: none; -webkit-mask: none; mask: none; }
  .cardmodal h2 { color: var(--paper); text-shadow: 0 2px 6px #000; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  .pick { padding: 16px 6px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 196px; }
  .pick:nth-child(1) { transform: rotate(-3deg); } .pick:nth-child(3) { transform: rotate(3deg); } .pick:active { transform: translateY(-6px); }
  .pick svg.ink { width: 74px; height: 74px; fill: rgba(23, 19, 31, .08); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
  .pick b { font: 800 17px/1.2 "Hahmlet", serif; } .pick span { font-size: 15px; line-height: 1.25; color: #6a3b10; font-weight: 700; }
  #update { position: absolute; left: 50%; top: 6px; transform: translateX(-50%) rotate(-1deg); padding: 9px 18px; font-weight: 800; font-size: 15px; z-index: 9; white-space: nowrap; }
  #load { position: absolute; inset: 0; display: grid; place-items: center; color: #b9a888; letter-spacing: .1em; font-size: 16px; }
  #dbg { position: absolute; left: 8px; bottom: 132px; font-size: 15px; color: #fff; background: rgba(0, 0, 0, .55); padding: 3px 8px; pointer-events: none; }
  /* paper pieces are two layers: .lift (shadow, pin, position) > .paper (ragged edge, tint, padding) */
  .lift { display: inline-block; } .lift > .paper { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .lift.block { display: block; } .lift.block > .paper { width: 100%; } .lift.grow { flex: 1; }
  button[disabled] { opacity: .45; pointer-events: none; } button:active > .btn { transform: translateY(2px) rotate(-.4deg); }
  .btn:active, .pick:active { transform: none; }
  h1.lift, h2.lift { margin: 0; } h1 > .paper { padding: 16px 30px 18px; } h2 > .paper { padding: 9px 12px; } #title h1 { padding: 0; } .top h2 { padding: 0; }
  #title .sub { padding: 0; } .sub2 { padding: 7px 18px; font-size: 17px; }
  .notes > :nth-child(1) { transform: rotate(-1.4deg); } .notes > :nth-child(2) { transform: rotate(1deg) translateY(2px); } .notes > :nth-child(3) { transform: rotate(-.7deg); }
  .note:nth-child(1), .note:nth-child(2), .note:nth-child(3) { transform: none; margin-left: 0; } .lift > .note { justify-content: flex-start; }
  .lift.bump { animation: bump .25s; }
  .cards > :nth-child(1) { transform: rotate(-3deg); } .cards > :nth-child(3) { transform: rotate(3deg); } .cards > .lift:active { transform: translateY(-6px); } .cards > .lift > .pick { flex-direction: column; width: 100%; }
  .pick:nth-child(1), .pick:nth-child(3) { transform: none; }
  .lift > .strip { justify-content: flex-start; text-align: left; } .lift > .col { display: block; } .lift > .sheet { display: block; } .sheetwrap { width: 100%; max-width: 350px; } .cardmodal .sheetwrap { max-width: 390px; filter: none; } .cardmodal .sheetwrap.pin::before { display: none; }
  #tip { padding: 0; } #tip > .paper { display: block; padding: 13px 20px 14px; }
  .mt { padding: 0; } .mtp { padding: 7px 16px; }
  .mi.lift { display: block; } .mi > .paper { display: grid; }
  #update { padding: 0; } #call .lift { display: block; }
  /* 3.0: the keeper's portrait and the two spells along the bottom, as paper tokens with a shade that drains while they recharge */
  #hud .bottom { gap: 7px; }
  .sk { width: 62px; position: relative; display: block; flex: none; } .sk > .paper { width: 62px; height: 62px; display: grid; place-items: center; position: relative; overflow: hidden; padding: 0; }
  .sk svg.ic { width: 42px; height: 42px; } .sk .veil2 { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(24, 16, 34, .66); pointer-events: none; }
  .sk em { display: block; text-align: center; font: 800 15px "Hahmlet", serif; font-style: normal; color: var(--paper); text-shadow: 0 1px 3px #000, 0 0 6px #000; margin-top: 3px; white-space: nowrap; }
  .sk.on > .paper { background-color: #f6b455; } .sk.down > .paper { background-color: #9a9080; }
  #sk-hero > .paper::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: 6px; height: 5px; background: linear-gradient(90deg, #4f8a3e calc(var(--hp, 1) * 100%), #3a2a2a 0); }
  .mi.sel > .paper { background-color: #f6b455; } #call .btn { white-space: nowrap; }
  @container (max-width: 400px) { #hud .bottom { gap: 5px; left: 6px; right: 6px; } .sk { width: 56px; } .sk > .paper { width: 56px; height: 56px; } .sk em { letter-spacing: -.06em; } #call .btn { padding: 10px 9px; } #hud .bottom .tab { width: 44px; } }
  body.shot #ui { display: none; }
  /* 4.0: wave flags at the sea roads, the card of a tapped shadow, difficulty strips, bestiary */
  #flags { position: absolute; inset: 0; pointer-events: none; }
  .flag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; }
  .flag > .paper { padding: 6px 10px 7px; gap: 3px; background-color: #f6b455; font-size: 15px; font-weight: 800; animation: sway 1.4s ease-in-out infinite; }
  .flag svg.ic { width: 20px; height: 20px; } .flag svg.foe { width: 24px; height: 24px; }
  svg.foe { fill: var(--ink); flex: none; width: 46px; height: 46px; }
  #card { position: absolute; left: 8px; right: 8px; top: calc(max(11px, env(safe-area-inset-top)) + 106px); display: flex; justify-content: center; pointer-events: none; }
  #card .lift { max-width: 100%; } .lift > .cardp { padding: 9px 14px 10px; gap: 10px; text-align: left; justify-content: flex-start; }
  .cardp .t b { display: block; font-size: 17px; } .cardp .t > span { display: block; font-size: 15px; color: #54452f; } .t > .ln { display: block; font-style: italic; color: #6a3b10 !important; }
  button.lift.block { width: 100%; margin-bottom: 11px; } button.lift.block > .strip { margin-bottom: 0; }
  .st3 { display: flex; gap: 3px; color: #b9a888; } .st3 svg.ic { width: 26px; height: 26px; } .st3 svg.ic.on { color: #e0891a; }
  .mi.full > .paper { background-color: #cbbd9c; } .mi.full small { color: #54452f; }
  #sk-hero > .paper::before { content: ""; position: absolute; left: 7px; right: 7px; bottom: 2px; height: 3px; background: linear-gradient(90deg, #d9801c calc(var(--xp, 0) * 100%), #3a2a2a 0); z-index: 1; }
  #dbg { bottom: auto; top: calc(max(11px, env(safe-area-inset-top)) + 58px); max-width: 60%; }
</style>
