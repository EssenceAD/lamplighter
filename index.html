<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>등불지기</title>
<meta name="theme-color" content="#05060f">
<meta name="description" content="등불 하나로 종이 마을의 밤을 지키는 그림자극 디펜스">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<style>
  :root { --ink: #0b0c1c; --navy: #141a3c; --paper: #f1e3c8; --paper2: #dcc9a6; --amber: #ffb054; --amber2: #ff8a3c; --dim: rgba(241, 227, 200, .62); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; overscroll-behavior: none; touch-action: none;
    font: 500 15px/1.45 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--paper); user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; overflow: hidden; width: min(100vw, 56.25vh); height: 100vh; }
  canvas { display: block; position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hide { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  .btn { background: var(--amber); color: #2a1606; font-weight: 700; padding: 13px 22px; border-radius: 14px 12px 15px 11px; box-shadow: 0 3px 0 #a85a1c, 0 8px 18px rgba(0, 0, 0, .4); min-height: 48px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a85a1c; }
  .btn.ghost { background: rgba(241, 227, 200, .12); color: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(241, 227, 200, .35); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  /* screens */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom)); }
  .veil { background: linear-gradient(rgba(5, 6, 15, .5), rgba(5, 6, 15, .82) 45%); }
  #title { justify-content: flex-end; align-items: center; gap: 12px; padding-bottom: 12vh; background: linear-gradient(rgba(5, 6, 15, 0) 40%, rgba(5, 6, 15, .75)); }
  #title h1 { font-size: 46px; letter-spacing: .12em; margin: 0; color: var(--paper); text-shadow: 0 2px 0 #7a4a1a, 0 0 28px rgba(255, 170, 80, .55); position: absolute; top: 16vh; }
  #title p { position: absolute; top: calc(16vh + 70px); margin: 0; color: var(--dim); letter-spacing: .08em; }
  #title .btn { width: 220px; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .top h2 { flex: 1; text-align: center; font-size: 18px; margin: 0; letter-spacing: .04em; }
  .purse { display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px; font-size: 13px; }
  .purse span { background: rgba(11, 12, 28, .7); padding: 5px 11px; border-radius: 99px; box-shadow: inset 0 0 0 1px rgba(241, 227, 200, .2); }
  .purse b { color: var(--amber); }
  .round { width: 44px; height: 44px; border-radius: 50%; background: rgba(11, 12, 28, .72); box-shadow: inset 0 0 0 1.5px rgba(241, 227, 200, .3); font-size: 18px; flex: none; }
  .body { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 2px 2px 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .night { aspect-ratio: 1 / 1.08; border-radius: 12px 10px 13px 9px; background: var(--paper); color: var(--ink); font-weight: 800; font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 3px 0 #9c8a66; position: relative; }
  .night small { font-size: 10px; letter-spacing: 1px; color: #c9772a; height: 12px; }
  .night.lock { background: rgba(241, 227, 200, .16); color: rgba(241, 227, 200, .4); box-shadow: none; pointer-events: none; }
  .night.boss { background: #ffd08a; }
  .night.next { outline: 2.5px solid var(--amber); outline-offset: 2px; }
  .night i { position: absolute; top: 3px; right: 5px; font-style: normal; font-size: 9px; color: #7a6a4a; font-weight: 600; }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .nav button { min-height: 48px; border-radius: 12px; background: rgba(11, 12, 28, .78); box-shadow: inset 0 0 0 1px rgba(241, 227, 200, .22); font-size: 14px; }
  .nav button.on { background: var(--paper); color: var(--ink); font-weight: 700; }
  .card { background: rgba(11, 12, 28, .82); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; box-shadow: inset 0 0 0 1px rgba(241, 227, 200, .16); }
  .card .t { flex: 1; min-width: 0; } .card .t b { display: block; } .card .t small { color: var(--dim); font-size: 12px; }
  .pips { letter-spacing: 2px; color: var(--amber); font-size: 11px; }
  .card .btn { padding: 9px 13px; min-height: 42px; font-size: 14px; white-space: nowrap; }
  .card.done { opacity: .75; } .card.sel { box-shadow: inset 0 0 0 2px var(--amber); }
  .swatch { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: 0 0 14px currentColor; background: currentColor; }
  h3 { font-size: 13px; color: var(--dim); margin: 12px 4px 6px; letter-spacing: .08em; font-weight: 600; }
  .rank { display: flex; gap: 10px; padding: 7px 10px; border-bottom: 1px solid rgba(241, 227, 200, .1); font-size: 14px; } .rank b { width: 24px; color: var(--amber); } .rank span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rank.me { background: rgba(255, 176, 84, .16); border-radius: 8px; }
  /* in a night */
  #hud .bar { position: absolute; left: 12px; right: 12px; top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; }
  .moonbar { flex: 1; height: 10px; border-radius: 9px; background: rgba(11, 12, 28, .7); box-shadow: inset 0 0 0 1px rgba(241, 227, 200, .25); position: relative; }
  .moonbar u { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background: linear-gradient(90deg, #5b6fd0, #ffb98a); }
  .moonbar em { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff3cf; box-shadow: 0 0 10px #fff3cf, inset -5px 0 0 #cdbb8c; }
  .moonbar s { position: absolute; right: -2px; top: -5px; font-size: 13px; text-decoration: none; }
  .wins { display: flex; gap: 3px; } .wins i { width: 11px; height: 14px; border-radius: 2px; background: var(--amber); box-shadow: 0 0 8px var(--amber); } .wins i.off { background: #2a2c44; box-shadow: none; }
  #hud .bottom { position: absolute; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; }
  .tools { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; }
  .tool { width: 50px; height: 54px; border-radius: 12px; background: rgba(11, 12, 28, .8); box-shadow: inset 0 0 0 1.5px rgba(241, 227, 200, .28); display: grid; place-items: center; }
  .tool svg { width: 30px; height: 36px; fill: var(--paper); } .tool.on { background: var(--paper); } .tool.on svg { fill: var(--ink); }
  #flash { width: 84px; height: 84px; border-radius: 50%; flex: none; font-weight: 800; font-size: 16px; color: #2a1606; position: relative; background: conic-gradient(var(--amber) calc(var(--c, 0) * 1turn), rgba(241, 227, 200, .2) 0); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
  #flash::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #3a2c1c; }
  #flash span { position: relative; color: var(--dim); } #flash.ready::before { background: var(--amber); } #flash.ready span { color: #2a1606; } #flash.ready { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255, 176, 84, .22), 0 6px 18px rgba(0, 0, 0, .5); } }
  #start { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); }
  #tip { position: absolute; left: 14px; right: 14px; top: 64px; background: rgba(11, 12, 28, .86); border-radius: 14px; padding: 10px 14px; text-align: center; box-shadow: inset 0 0 0 1px rgba(255, 176, 84, .5); transition: opacity .5s; pointer-events: none; }
  #tip b { color: var(--amber); display: block; font-size: 13px; letter-spacing: .06em; }
  #finger { position: absolute; font-size: 38px; margin: -6px 0 0 -14px; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .6)); animation: tapit 1.2s ease-in-out infinite; }
  @keyframes tapit { 0%, 100% { transform: translate(0, 16px); } 50% { transform: translate(var(--dx, 0), var(--dy, 0)); } }
  /* sheets */
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 15, .66); padding: 18px; }
  .sheet { width: 100%; max-width: 340px; background: var(--paper); color: var(--ink); border-radius: 20px 17px 22px 16px; padding: 20px 18px; text-align: center; box-shadow: 0 5px 0 #9c8a66, 0 20px 50px rgba(0, 0, 0, .6); }
  .sheet h2 { margin: 0 0 6px; font-size: 22px; } .sheet p { margin: 6px 0; color: #5a4a35; }
  .stars { font-size: 38px; letter-spacing: 6px; color: #d9cbb0; margin: 6px 0; } .stars b { color: #f09a1c; text-shadow: 0 0 14px rgba(255, 170, 60, .7); }
  .sheet .row { display: flex; gap: 8px; margin-top: 14px; } .sheet .row .btn { flex: 1; padding: 12px 6px; } .sheet .btn.ghost { color: var(--ink); box-shadow: inset 0 0 0 1.5px #9c8a66; background: none; }
  .sheet input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 11px; border-radius: 10px; border: 2px solid #9c8a66; background: #fff8e8; text-align: center; margin-top: 8px; user-select: text; -webkit-user-select: text; }
  .setrow { display: flex; align-items: center; gap: 10px; margin: 10px 0; text-align: left; } .setrow span { width: 62px; font-weight: 700; } .setrow input[type=range] { flex: 1; accent-color: #d9801c; }
  .tog { width: 52px; height: 30px; border-radius: 20px; background: #b9a888; position: relative; flex: none; } .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff8e8; transition: .15s; } .tog.on { background: #e08a1c; } .tog.on::after { left: 25px; }
  #update { position: absolute; left: 0; right: 0; top: 0; background: var(--amber); color: #2a1606; text-align: center; padding: 9px 10px; font-weight: 700; font-size: 14px; z-index: 9; }
  #load { position: absolute; inset: 0; display: grid; place-items: center; color: #8f8a7a; letter-spacing: .14em; font-size: 13px; }
  #dbg { position: absolute; left: 6px; bottom: 2px; font-size: 10px; color: rgba(255, 255, 255, .5); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"><div id="frame"><div id="load">등불을 켜는 중…</div><div id="ui"></div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
